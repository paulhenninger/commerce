spring:
  application:
    name: controller

commerce:
  edge:
    # Reached only by the ops service on the control network.
    required: false
  controller:
    docker-url: ${DOCKER_PROXY_URL:http://docker-proxy:2375}
    api-version: ${DOCKER_API_VERSION:v1.47}
    # The Compose project whose containers may be acted on.
    project: ${COMPOSE_PROJECT:}
  experiments:
    prometheus-url: ${PROMETHEUS_URL:http://prometheus:9090}
    testkit-url: ${TESTKIT_URL:http://testkit:8080}
    storefront-url: ${STOREFRONT_URL:http://storefront-web:8080}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    admin-password: ${DEV_ADMIN_PASSWORD:}
    state-dir: ${CONTROLLER_STATE_DIR:/var/lib/commerce}
    saga-timeout: ${ORDER_SAGA_TIMEOUT:2m}
