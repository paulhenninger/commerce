# Defaults for every event-driven service, applied by PlatformDefaults when
# platform:messaging is on the classpath.

spring:
  datasource:
    # DB_URL, DB_USER and DB_PASSWORD have no defaults: a service with no database
    # configured must fail at startup, not fall back to somebody else's.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Small and bounded: under overload requests wait briefly for a connection
      # and then fail fast, instead of piling up on MySQL.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 2000
  flyway:
    # Migrations run as the owner login; the application login above cannot
    # change the schema.
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      # Every client authenticates as its own service; the broker's ACLs decide
      # what that service may read and write. No default credentials.
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # Acknowledged by every in-sync replica, without duplicates on retry.
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        # How long a send may block waiting for metadata when Kafka is away; the
        # default (60 s) would stall the outbox relay for a minute per attempt.
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Raw bytes: the platform parses them itself, so a malformed record is an
      # ordinary exception in the listener and takes the dead-letter path.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      properties:
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
      # Continues the producer's trace in the consumer.
      observation-enabled: true
      # A consumed topic that does not exist is a deployment error (kafka-init
      # creates them): fail at startup rather than wait for it forever.
      missing-topics-fatal: true
