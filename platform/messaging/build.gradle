// Reliable messaging for a service that owns a database: the transactional
// outbox (state change and event commit together), idempotent consumption, and
// Kafka listeners that retry, then park what they cannot process on a
// dead-letter topic instead of blocking the partition.
plugins {
    id 'java-library'
    // What every service's integration tests share: real MySQL and Kafka, a tap
    // on the topics, and requests that look like they came through the edge.
    id 'java-test-fixtures'
}

dependencies {
    api project(':platform:core')
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    api 'org.springframework.boot:spring-boot-starter-kafka'
    api 'org.springframework.boot:spring-boot-starter-flyway'
    api 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.testcontainers:testcontainers-junit-jupiter'
    testFixturesApi 'org.testcontainers:testcontainers-mysql'
    testFixturesApi 'org.testcontainers:testcontainers-kafka'
    testFixturesApi 'org.awaitility:awaitility'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
