plugins {
    // Lets Gradle auto-download the JDK the toolchain asks for.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'commerce'

// Shared libraries: what every service does the same way (logging, tracing,
// errors, the event envelope) and the transactional messaging kit.
include 'platform:core'
include 'platform:messaging'

// Deployed everywhere: identity, catalog, inventory, order, billing, shipping,
// notification, ops. Deployed to DEV only — never to int, qa or prod (see
// deploy/compose.dev.yml and scripts/verify-clean-deployments.sh, which CI runs):
// simulators, testkit, controller.
['identity', 'catalog', 'inventory', 'order', 'billing', 'shipping', 'notification', 'ops',
 'simulators', 'testkit', 'controller'].each { name ->
    // A service joins the build once it has source.
    if (new File(rootDir, "services/${name}/src/main/resources/application.yml").exists()) {
        include "services:${name}"
    }
}
