// Root build: versions and conventions shared by every module. Each service is
// an independently deployable Spring Boot application; they share source only
// through platform:core and platform:messaging, never through each other.

plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.github.spotbugs' version '6.5.13' apply false
}

allprojects {
    group = 'com.thirdstone'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }
}

// Every module that holds code: the leaves (:platform:core, :services:order, ...),
// not the bare 'platform' and 'services' containers.
configure(subprojects.findAll { it.path.count(':') == 2 }) {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            // The current LTS. CI fails if this, the Dockerfile and ci.yml disagree.
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // One set of versions (Spring Boot's) for every module, libraries included.
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
        // Kafka's compression codecs, ahead of the BOM until kafka-clients moves:
        // lz4-java before 1.11.4 runs code from an insecure temporary file
        // (CVE-2026-106451); snappy-java before 1.1.10.9 overflows or exhausts
        // memory on malformed input (CVE-2026-93451, CVE-2026-108106). Found by
        // Trivy (security.yml). Drop a line once the BOM's version is past it.
        dependencies {
            dependency 'at.yawk.lz4:lz4-java:1.11.4'
            dependency 'org.xerial.snappy:snappy-java:1.1.10.9'
            // OpenTelemetry before 1.67.0 parses a crafted `tracestate` header in
            // quadratic time (CVE-2026-118259, GHSA-ccrj-gw8r-854m), and the edges pass
            // that header through. Found by Dependabot. Every artifact of the release
            // moves together. Drop once the BOM's opentelemetry.version is past it.
            dependencySet(group: 'io.opentelemetry', version: '1.67.0') {
                ['api', 'common', 'context', 'exporter-common', 'exporter-otlp',
                 'exporter-otlp-common', 'exporter-sender-okhttp',
                 'extension-trace-propagators', 'sdk', 'sdk-common',
                 'sdk-extension-autoconfigure-spi', 'sdk-logs', 'sdk-metrics',
                 'sdk-trace'].each { entry "opentelemetry-$it" }
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation' << '-parameters'
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

// The services other than identity (which keeps its own, fuller build file) are
// plain Boot applications on the platform libraries.
def platformServices = ['catalog', 'inventory', 'order', 'billing', 'shipping', 'notification', 'ops', 'simulators', 'testkit', 'controller']
// Those with a database and Kafka: they get the outbox, the idempotent
// dispatcher, and integration tests against real MySQL and Kafka.
def eventServices = ['catalog', 'inventory', 'order', 'billing', 'shipping', 'notification', 'ops']
configure(subprojects.findAll { it.parent?.name == 'services' && it.name in platformServices }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation project(':platform:core')
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    // One predictable jar name per service for the Dockerfile.
    tasks.named('bootJar') {
        archiveFileName = "${project.name}.jar"
    }
    tasks.named('jar') {
        enabled = false
    }
}

configure(subprojects.findAll { it.parent?.name == 'services' && it.name in eventServices }) {
    dependencies {
        implementation project(':platform:messaging')
        testImplementation testFixtures(project(':platform:messaging'))
    }
}
