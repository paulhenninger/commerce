# Who the caller is, as identity answered the auth check. Included after
# "auth_request /_authz;" (or /_authz_admin), through proxy-authed.conf or by a
# location that sets its own timeouts (a stream). Identity's answers replace
# anything the client sent under the same names, and the edge token marks the
# request as having come through here.
auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
auth_request_set $auth_email $upstream_http_x_auth_email;
auth_request_set $auth_role $upstream_http_x_auth_role;
auth_request_set $auth_strong $upstream_http_x_auth_strong;
auth_request_set $auth_error $upstream_http_x_auth_error;
# JSON, like every other API error, so the SPA's refresh logic can react.
error_page 401 = @unauthorized;
error_page 403 = @forbidden;
error_page 500 = @auth_unavailable;

proxy_set_header X-Auth-User-Id $auth_user_id;
proxy_set_header X-Auth-Email $auth_email;
proxy_set_header X-Auth-Role $auth_role;
proxy_set_header X-Auth-Strong $auth_strong;
include /tmp/nginx/edge-token.conf;
