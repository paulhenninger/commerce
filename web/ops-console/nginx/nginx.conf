# The ops console's edge: serves the console SPA and proxies its API. Every
# /api/v1/ops request is checked with identity first and must belong to an
# administrator (with a two-factor session where OPS_REQUIRE_MFA is on). Same
# hardening as the storefront edge: unprivileged, read-only, /tmp only.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Path only, never the query string (see the storefront edge).
    map $request_uri $request_path {
        "~^(?<path>[^?]*)" $path;
    }
    log_format private '$remote_addr [$time_local] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent $request_time upstream=$upstream_addr '
                       'upstream_time=$upstream_response_time request_id=$request_id '
                       'trace_id=$upstream_http_x_trace_id "$http_user_agent"';
    access_log /dev/stdout private;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream identity {
        zone identity 64k;
        server identity:8080 resolve max_fails=2 fail_timeout=2s;
        keepalive 16;
    }
    upstream ops {
        zone ops 64k;
        server ops:8080 resolve max_fails=2 fail_timeout=2s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 64k;
        client_body_timeout 10s;
        client_header_timeout 10s;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Sign-in, through identity, exactly as on the storefront.
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            include /etc/nginx/snippets/proxy-public.conf;
            proxy_pass http://identity;
        }

        location /api/v1/users/ {
            limit_req zone=api burst=100 nodelay;
            include /etc/nginx/snippets/proxy-public.conf;
            proxy_pass http://identity;
        }

        # The live feed: a long-lived stream, passed through as it is written.
        location = /api/v1/ops/live {
            auth_request /_authz_admin;
            include /etc/nginx/snippets/api-headers.conf;
            include /etc/nginx/snippets/proxy-caller.conf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            # Never retried: a stream is not idempotent in the sense that matters here.
            proxy_next_upstream off;
            proxy_pass http://ops;
        }

        location /api/v1/ops/ {
            limit_req zone=api burst=100 nodelay;
            auth_request /_authz_admin;
            include /etc/nginx/snippets/api-headers.conf;
            include /etc/nginx/snippets/proxy-authed.conf;
            proxy_pass http://ops;
        }

        location = /_authz_admin {
            include /etc/nginx/snippets/authz.conf;
            proxy_pass http://identity/internal/authz?require=admin;
        }

        location @unauthorized {
            default_type application/json;
            include /etc/nginx/snippets/api-headers.conf;
            # Answered here, not by a service: give the reference the page shows.
            add_header X-Request-Id $request_id always;
            return 401 '{"message":"Authentication required"}';
        }

        location @forbidden {
            default_type application/json;
            include /etc/nginx/snippets/api-headers.conf;
            # Answered here, not by a service: give the reference the page shows.
            add_header X-Request-Id $request_id always;
            return 403 '{"message":"Administrators only","code":"$auth_error"}';
        }

        location @auth_unavailable {
            default_type application/json;
            include /etc/nginx/snippets/api-headers.conf;
            # Answered here, not by a service: give the reference the page shows.
            add_header X-Request-Id $request_id always;
            add_header Retry-After 5 always;
            return 503 '{"message":"Service temporarily unavailable","code":"UNAVAILABLE"}';
        }

        location /api/ {
            default_type application/json;
            include /etc/nginx/snippets/api-headers.conf;
            # Answered here, not by a service: give the reference the page shows.
            add_header X-Request-Id $request_id always;
            return 404 '{"message":"Not found","code":"NOT_FOUND"}';
        }

        location ~ ^/(internal|actuator) {
            include /etc/nginx/snippets/security-headers.conf;
            return 404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
