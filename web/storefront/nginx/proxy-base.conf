# What every proxied request gets. No proxy_pass and no identity headers: the
# location chooses the upstream, and proxy-public.conf or proxy-authed.conf adds
# who the caller is (or that nobody is).
proxy_http_version 1.1;
# Reuse upstream connections (see the keepalive lines in nginx.conf).
proxy_set_header Connection "";
proxy_set_header Host $host;
# RESET the header — never append ($proxy_add_x_forwarded_for). The rate limiters
# behind key on the first hop, and appending would let clients choose their own key.
# $remote_addr is the client as settled by trusted-proxies.conf.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 2s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;
# A replica that refuses, times out or answers 502/503/504 is skipped and the
# request tried once on another. nginx does this only for idempotent methods:
# a POST that may have been processed is never sent twice.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;
