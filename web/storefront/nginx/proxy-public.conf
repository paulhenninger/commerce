# A request forwarded without an identity: public routes, and identity's own API
# (which reads the access token itself). Whatever X-Auth-* the client sent is
# removed, and no edge token is attached, so the service treats it as anonymous.
include /etc/nginx/snippets/proxy-base.conf;
proxy_set_header X-Auth-User-Id "";
proxy_set_header X-Auth-Email "";
proxy_set_header X-Auth-Role "";
proxy_set_header X-Auth-Strong "";
proxy_set_header X-Edge-Token "";
