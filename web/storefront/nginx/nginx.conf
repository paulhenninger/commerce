# The storefront edge: serves the SPA and is the only way in to the services
# behind it, so the browser sees a single origin (which the refresh cookie and
# the CSP rely on). It runs as an unprivileged user on a read-only filesystem:
# everything it writes is in /tmp.
#
# What it does for every API request:
#   - authenticates it, by asking identity (auth_request), before any other
#     service sees it — and tells that service who the caller is in X-Auth-*
#     headers that a client cannot set;
#   - spreads it over the replicas of the service, skipping ones that fail;
#   - limits how fast one client may call;
#   - caches public catalog reads for a few seconds, and keeps serving them from
#     the cache if the catalog service is down.
#
# It owns the browser security headers for the pages (security-headers.conf) and
# for the domain services' JSON (api-headers.conf); identity sets its own.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The access log records the path only: no query string, no Referer. Commerce's
    # emailed links keep their tokens in the URL fragment, which never reaches a
    # server, but whatever you add later may not — so nothing in a query string is
    # ever written to the log here. The request id and the upstream's trace id
    # lead from a line here to the request's logs and trace in every service.
    map $request_uri $request_path {
        "~^(?<path>[^?]*)" $path;
    }
    log_format private '$remote_addr [$time_local] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent $request_time upstream=$upstream_addr '
                       'upstream_time=$upstream_response_time cache=$upstream_cache_status '
                       'request_id=$request_id trace_id=$upstream_http_x_trace_id "$http_user_agent"';
    access_log /dev/stdout private;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The client address the rate limits key on. X-Forwarded-For is believed only
    # from a proxy listed in trusted-proxies.conf (none by default); from anyone
    # else, the connecting address is the client. See that file.
    include /etc/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # https as reported by the TLS terminator in front, else this connection's scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # First-line throttles, keyed on the real client. Identity enforces finer
    # per-endpoint, per-account limits behind the auth one.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=${API_RATE}r/s;
    limit_req_status 429;

    # Docker's DNS, asked again every few seconds: replicas that start, stop or
    # are replaced are picked up without restarting the edge.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # One upstream per service. "resolve" follows the service name to all its
    # replicas; a replica that fails twice is left alone for five seconds; idle
    # connections are kept open so most requests skip the TCP handshake.
    upstream identity {
        zone identity 64k;
        server identity:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 32;
    }
    upstream catalog {
        zone catalog 64k;
        server catalog:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 32;
    }
    include /etc/nginx/upstreams/*.conf;

    # Public catalog reads: five seconds fresh, then refreshed in the background;
    # kept for ten minutes to serve if the catalog service cannot answer.
    proxy_cache_path /tmp/catalog_cache levels=1:2 keys_zone=catalog_cache:10m max_size=48m inactive=10m
                     use_temp_path=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Bodies the API accepts are tiny; the services also enforce their own caps.
        client_max_body_size 64k;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # Security headers are included per location: add_header does NOT merge,
        # so a location with an add_header of its own silently drops inherited ones.

        # SPA fallback: every non-file route gets index.html, never cached, so a
        # deploy (and any CSP change) reaches users immediately.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Hashed assets are immutable.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # ------------------------------------------------------------ identity
        # Identity reads the access token itself; these routes need no auth check
        # here. It sets its own response headers.

        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            include /etc/nginx/snippets/proxy-public.conf;
            proxy_pass http://identity;
        }

        location ~ ^/api/v1/(users|admin)/ {
            limit_req zone=api burst=${API_BURST} nodelay;
            include /etc/nginx/snippets/proxy-public.conf;
            proxy_pass http://identity;
        }

        # ------------------------------------------------------------- catalog

        location /api/v1/catalog/ {
            limit_req zone=api burst=${API_BURST} nodelay;
            proxy_cache catalog_cache;
            proxy_cache_key "$request_method|$request_uri";
            proxy_cache_valid 200 404 5s;
            # One request per key refills the cache; the rest wait for it rather
            # than all hitting the service at once.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 3s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header X-Cache-Status $upstream_cache_status always;
            include /etc/nginx/snippets/api-headers.conf;
            include /etc/nginx/snippets/proxy-public.conf;
            proxy_pass http://catalog;
        }

        # --------------------------------------------- back office (admin, 2FA)

        location /api/v1/backoffice/catalog/ {
            limit_req zone=api burst=${API_BURST} nodelay;
            auth_request /_authz_admin;
            include /etc/nginx/snippets/api-headers.conf;
            include /etc/nginx/snippets/proxy-authed.conf;
            proxy_pass http://catalog;
        }

        include /etc/nginx/routes/*.conf;

        # ------------------------------------------------------- the auth check

        location = /_authz {
            include /etc/nginx/snippets/authz.conf;
            proxy_pass http://identity/internal/authz;
        }

        location = /_authz_admin {
            include /etc/nginx/snippets/authz.conf;
            proxy_pass http://identity/internal/authz?require=admin;
        }

        location @unauthorized {
            default_type application/json;
            include /etc/nginx/snippets/api-headers.conf;
            # Answered here, not by a service: give the reference the page shows.
            add_header X-Request-Id $request_id always;
            return 401 '{"message":"Authentication required"}';
        }

        location @forbidden {
            default_type application/json;
            include /etc/nginx/snippets/api-headers.conf;
            # Answered here, not by a service: give the reference the page shows.
            add_header X-Request-Id $request_id always;
            return 403 '{"message":"Forbidden","code":"$auth_error"}';
        }

        # Identity could not be asked. Never "allow": no answer is not a yes.
        location @auth_unavailable {
            default_type application/json;
            include /etc/nginx/snippets/api-headers.conf;
            # Answered here, not by a service: give the reference the page shows.
            add_header X-Request-Id $request_id always;
            add_header Retry-After 5 always;
            return 503 '{"message":"Service temporarily unavailable","code":"UNAVAILABLE"}';
        }

        # Anything else under /api is not routed anywhere.
        location /api/ {
            default_type application/json;
            include /etc/nginx/snippets/api-headers.conf;
            # Answered here, not by a service: give the reference the page shows.
            add_header X-Request-Id $request_id always;
            return 404 '{"message":"Not found","code":"NOT_FOUND"}';
        }

        # Never proxied: the services' internal endpoints (the auth check among
        # them) and their management ports. Belt and braces: refuse the paths.
        location ~ ^/(internal|actuator) {
            include /etc/nginx/snippets/security-headers.conf;
            return 404;
        }

        # For the container healthcheck only.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
