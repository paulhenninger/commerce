# Orders: signed-in customers only.
location ~ ^/api/v1/orders(/|$) {
    limit_req zone=api burst=${API_BURST} nodelay;
    limit_req zone=orders burst=5 nodelay;
    auth_request /_authz;
    include /etc/nginx/snippets/api-headers.conf;
    include /etc/nginx/snippets/proxy-authed.conf;
    proxy_pass http://order;
}

# Back office: administrators with a two-factor session.
location /api/v1/backoffice/orders {
    limit_req zone=api burst=${API_BURST} nodelay;
    auth_request /_authz_admin;
    include /etc/nginx/snippets/api-headers.conf;
    include /etc/nginx/snippets/proxy-authed.conf;
    proxy_pass http://order;
}

