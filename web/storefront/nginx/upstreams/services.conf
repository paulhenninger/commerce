upstream order {
    zone order 64k;
    server order:8080 resolve max_fails=2 fail_timeout=2s;
    keepalive 32;
}
upstream inventory {
    zone inventory 64k;
    server inventory:8080 resolve max_fails=2 fail_timeout=2s;
    keepalive 16;
}
upstream billing {
    zone billing 64k;
    server billing:8080 resolve max_fails=2 fail_timeout=2s;
    keepalive 16;
}
upstream shipping {
    zone shipping 64k;
    server shipping:8080 resolve max_fails=2 fail_timeout=2s;
    keepalive 8;
}
upstream notification {
    zone notification 64k;
    server notification:8080 resolve max_fails=2 fail_timeout=2s;
    keepalive 8;
}

# Placing orders, per signed-in caller: 2 a second, bursts of 5. The limit runs
# before the auth check, so it keys on the bearer token itself (one per session);
# only POSTs are counted — an empty key is not limited.
map $request_method $order_post_key {
    POST    $http_authorization;
    default "";
}
limit_req_zone $order_post_key zone=orders:10m rate=2r/s;
