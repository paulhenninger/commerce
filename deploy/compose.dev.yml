# DEV only. Everything in this file is test tooling: it is never part of an INT,
# QA or PROD deployment (scripts/verify-clean-deployments.sh proves it in CI, and
# each service refuses to start outside dev if it is pointed at any of this).

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:

  # Local mail catcher — every email the system sends lands in the web UI at
  # http://localhost:8025. Nothing leaves the machine.
  mailpit:
    <<: *hardened
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    user: "65534:65534"
    networks: [mail, mail-ingress]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    tmpfs:
      - /tmp:size=64m
    mem_limit: 128m
    pids_limit: 64

  identity:
    networks: [mail]
    depends_on:
      mailpit:
        condition: service_started

  # A fake payment provider and carrier, with fault switches. Its admin API
  # (faults) is published on loopback for the chaos lab and smoke.sh.
  simulators:
    <<: *hardened
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: simulators
    image: commerce-simulators:${IMAGE_TAG:-local}
    networks: [sandbox, telemetry, simulators-ingress]
    environment:
      COMMERCE_ENV: dev
      # billing's key and shipping's key.
      SIMULATOR_API_KEY: ${PAYMENT_GATEWAY_KEY:?Set PAYMENT_GATEWAY_KEY},${CARRIER_KEY:?Set CARRIER_KEY}
      OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
    ports:
      - "127.0.0.1:${SIMULATORS_PORT:-8090}:8080"
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    pids_limit: 256

  billing:
    networks: [sandbox]
    depends_on:
      simulators:
        condition: service_healthy

  shipping:
    networks: [sandbox]
    depends_on:
      simulators:
        condition: service_healthy

  notification:
    networks: [mail]
    depends_on:
      mailpit:
        condition: service_started

  # DEV: alerts are also emailed to Mailpit, and Prometheus and Alertmanager
  # are published on loopback for exploration.
  alertmanager:
    networks: [mail, tools-ingress]
    volumes:
      - ./observability/alertmanager/alertmanager.dev.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"

  prometheus:
    networks: [tools-ingress]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  # Seeds accounts and products, runs simulated shoppers through the storefront
  # edge, taps every topic for contract violations, runs the chaos lab's actors.
  # Reached only by the ops service (control network).
  testkit:
    <<: *hardened
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: testkit
    image: commerce-testkit:${IMAGE_TAG:-local}
    depends_on:
      storefront-web:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      sim:
        # Fixed: the storefront edge believes X-Forwarded-For from this address
        # only (dev/trusted-proxies.conf).
        ipv4_address: ${COMMERCE_NET:-10.77}.25.10
      control: {}
      events: {}
      mail: {}
      sandbox: {}
      telemetry: {}
    environment:
      COMMERCE_ENV: dev
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092}
      KAFKA_PASSWORD_TESTKIT: ${KAFKA_PASSWORD_TESTKIT:?Set KAFKA_PASSWORD_TESTKIT}
      KAFKA_PASSWORD_TESTKIT_CHAOS: ${KAFKA_PASSWORD_TESTKIT_CHAOS:?Set KAFKA_PASSWORD_TESTKIT_CHAOS}
      KAFKA_PASSWORD_INTRUDER: ${KAFKA_PASSWORD_INTRUDER:?Set KAFKA_PASSWORD_INTRUDER}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:?Set DEV_ADMIN_PASSWORD}
      DEV_SHOPPER_PASSWORD: ${DEV_SHOPPER_PASSWORD:?Set DEV_SHOPPER_PASSWORD}
      TESTKIT_SHOPPERS: ${TESTKIT_SHOPPERS:-0}
      OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
    tmpfs:
      - /tmp:size=64m
    mem_limit: 384m
    pids_limit: 512

  # The only container that touches the Docker socket (ADR-027): an explicit
  # allowlist (dev/docker-proxy.conf) of listing containers and the six
  # lifecycle actions. Runs as the image's unprivileged user; group 0 is added
  # only because the socket is root:root 660. No capabilities, no published
  # port, and the docker network is its only one.
  docker-proxy:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    group_add: ["0"]
    entrypoint: ["nginx", "-g", "daemon off;"]
    networks: [docker]
    volumes:
      - ./dev/docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp:size=8m
    mem_limit: 48m
    pids_limit: 32
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Starts, stops, kills, pauses and restarts this deployment's instances for the
  # ops console, within an allowlist that never includes itself, the proxy, ops
  # or the observability stack.
  controller:
    <<: *hardened
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: controller
    image: commerce-controller:${IMAGE_TAG:-local}
    depends_on:
      docker-proxy:
        condition: service_healthy
    networks: [docker, control, telemetry]
    environment:
      COMMERCE_ENV: dev
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
      OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    pids_limit: 256

  storefront-web:
    networks: [sim]
    volumes:
      - ./dev/trusted-proxies.conf:/etc/nginx/trusted-proxies.conf:ro

  ops:
    networks: [control]
    environment:
      TESTKIT_URL: http://testkit:8080
      CONTROLLER_URL: http://controller:8080

  # The lab's principals: testkit, testkit-chaos, intruder.
  kafka-init:
    environment:
      INIT_DEV: "true"
      KAFKA_PASSWORD_TESTKIT: ${KAFKA_PASSWORD_TESTKIT:?Set KAFKA_PASSWORD_TESTKIT}
      KAFKA_PASSWORD_TESTKIT_CHAOS: ${KAFKA_PASSWORD_TESTKIT_CHAOS:?Set KAFKA_PASSWORD_TESTKIT_CHAOS}
      KAFKA_PASSWORD_INTRUDER: ${KAFKA_PASSWORD_INTRUDER:?Set KAFKA_PASSWORD_INTRUDER}

networks:
  # Fixed ranges: see compose.yml.
  # billing, shipping ↔ simulators
  sandbox:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.22.0/24
  # The testkit's shoppers ↔ the storefront edge
  sim:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.25.0/24
  # ops ↔ testkit
  control:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.26.0/24
  # controller ↔ docker-proxy: the only path to the Docker API
  docker:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.27.0/24
  tools-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.24.0/24
  simulators-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.23.0/24
  # services ↔ mailpit
  mail:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.20.0/24
  mail-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.21.0/24
