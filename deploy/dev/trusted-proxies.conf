# DEV only (compose.dev.yml mounts this over the storefront edge's default).
#
# The testkit's simulated shoppers each present their own client address in
# X-Forwarded-For, so every per-IP limit applies per shopper, as it would to
# distinct real customers (ADR-021). Only the testkit's fixed address on the
# sim network is believed; no limit is switched off. It must match the testkit's
# ipv4_address in compose.dev.yml (COMMERCE_NET 10.77, the dev default).
set_real_ip_from 10.77.25.10;
