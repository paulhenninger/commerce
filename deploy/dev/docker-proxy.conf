# DEV only: the one container that can reach the Docker socket (ADR-027), as an
# explicit allowlist. Everything not listed here is refused with 403:
#
#   GET  /v1.N/containers/json                 list this host's containers
#   GET  /v1.N/containers/<id>/json            one container's details
#   POST /v1.N/containers/<id>/<action>        start stop kill pause unpause restart
#
# Never images, volumes, networks, exec, or creating a container — the calls that
# would turn "restart a service" into "run anything on the host". Only the
# controller, on the docker network, can reach this.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    server_tokens off;
    access_log /dev/stdout;

    # Requests carry no body worth having: actions take their options in the query.
    client_max_body_size 1k;

    upstream docker {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        location ~ ^/v1\.[0-9]+/containers/json$ {
            limit_except GET { deny all; }
            proxy_pass http://docker;
        }

        location ~ "^/v1\.[0-9]+/containers/[a-f0-9]{12,64}/json$" {
            limit_except GET { deny all; }
            proxy_pass http://docker;
        }

        location ~ "^/v1\.[0-9]+/containers/[a-f0-9]{12,64}/(start|stop|kill|pause|unpause|restart)$" {
            limit_except POST { deny all; }
            proxy_read_timeout 60s;
            proxy_pass http://docker;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 403 "Refused: not on the docker-proxy allowlist\n";
        }
    }
}
