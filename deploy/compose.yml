# Commerce, everything that runs in every environment. Start it through
# scripts/stack.sh, which adds the files and settings an environment needs:
#
#   scripts/stack.sh dev up -d --build --wait      →  http://localhost:8081
#
# compose.dev.yml adds the DEV-only tooling (mail catcher, simulators, testkit);
# compose.ha.yml the replicas and extra brokers; compose.<env>.yml an
# environment's own settings. Nothing DEV-only is defined in this file.
#
# Every container runs as an ordinary user, on a read-only filesystem, with every
# Linux capability dropped, no way to gain more, and capped memory and process
# counts. Each joins only the networks it needs (architecture, section 12):
#
#   browser ──▶ storefront-web ──(edge)──▶ identity, catalog, …
#                                            ├──(data)────▶ mysql
#                                            └──(events)──▶ kafka
#
# The edge cannot reach MySQL or Kafka. Only the edge publishes an application
# port, and published ports are bound to this computer only.
#
# No password has a default here: every secret comes from the environment file
# (deploy/env/<env>.env), and Compose refuses to start without it.

# What every container gets: nothing written outside /tmp (memory only) and its
# data volume, no Linux capabilities, no privilege escalation (setuid included),
# and rotated logs (they hold email and IP addresses).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

# A JVM service: built from services/Dockerfile, small and bounded.
x-jvm: &jvm
  <<: *hardened
  tmpfs:
    - /tmp:size=64m
  mem_limit: 320m
  pids_limit: 256

# Settings every platform service shares.
x-service-env: &service-env
  COMMERCE_ENV: ${COMMERCE_ENV:?Set COMMERCE_ENV (dev, int, qa or prod)}
  EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?Set EDGE_SHARED_SECRET}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092}
  OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
  TRACE_SAMPLING: ${TRACE_SAMPLING:-1.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-mysql-image: &mysql-image
  # The current LTS line. After 9.7, MySQL versions are dated Innovation
  # releases (26.x) each supported only until the next; Dependabot is told to
  # stay on 9.7 and CI checks this matches the tests' containers.
  mysql:9.7.4@sha256:86b390ef642f89a0157d6215dee33ddc928b8b0ecab173117f56f6c40cb24eab

x-kafka-image: &kafka-image
  apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f

x-kafka: &kafka
  <<: *hardened
  image: *kafka-image
  entrypoint: ["/bin/bash", "/commerce/start.sh"]
  networks: [events]
  tmpfs:
    - /tmp:size=64m
  mem_limit: 512m
  pids_limit: 512
  healthcheck:
    # The client listener accepts connections; kafka-init does the real check
    # (an authenticated request) before anything depends on the cluster.
    test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/9092"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 30s

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Q29tbWVyY2VLYWZrYUNsdXN0ZQ}
  QUORUM_VOTERS: ${KAFKA_QUORUM_VOTERS:-1@kafka-1:9095}
  REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
  MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
  BROKER_PASSWORD: ${KAFKA_PASSWORD_BROKER:?Set KAFKA_PASSWORD_BROKER}
  INIT_PASSWORD: ${KAFKA_PASSWORD_INIT:?Set KAFKA_PASSWORD_INIT}

services:

  # ----------------------------------------------------------------- database

  mysql:
    <<: *hardened
    image: *mysql-image
    # Runs as the mysql user from the start, so it needs no capability to switch.
    user: mysql
    command:
      - --character-set-server=utf8mb4
      # Every connection over the network is encrypted (with the certificate MySQL
      # creates on first start), accounts are matched by address and never by a
      # DNS name, the server reads no file a client names, and the X protocol port
      # is closed.
      - --require-secure-transport=ON
      - --skip-name-resolve
      - --local-infile=OFF
      - --mysqlx=OFF
      # Every service has a small bounded pool; this leaves headroom for all of
      # them at two replicas each.
      - --max-connections=400
      - --innodb-buffer-pool-size=256M
      # Not the 'sha256_password is deprecated' warning: for an unknown user (the healthcheck's
      # ping) MySQL fakes a login with a plugin drawn at random, so names can't be probed. No account uses it.
      - --log-error-suppression-list=MY-013360
    environment:
      # The administrator exists only for connections from inside this container
      # (and mysql-init, through the shared socket): nothing on the network can
      # sign in as root, even with the password.
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      MYSQL_ROOT_HOST: localhost
    networks: [data]
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-socket:/var/run/mysqld
    tmpfs:
      - /tmp:size=64m
    mem_limit: 768m
    pids_limit: 512
    healthcheck:
      # Over TCP, which MySQL opens only once first-start initialisation is done.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Creates or repairs every database and its two logins (mysql/roles.sql), then
  # exits: the owner that runs migrations, and the app login that can only read
  # and write rows. Signs in as root over the socket that only it and the
  # database share; it has no network at all.
  mysql-init:
    <<: *hardened
    image: *mysql-image
    user: mysql
    restart: "no"
    network_mode: none
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      IDENTITY_DB_OWNER_PASSWORD: ${IDENTITY_DB_OWNER_PASSWORD:?Set IDENTITY_DB_OWNER_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      CATALOG_DB_OWNER_PASSWORD: ${CATALOG_DB_OWNER_PASSWORD:?Set CATALOG_DB_OWNER_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
      ORDERS_DB_OWNER_PASSWORD: ${ORDERS_DB_OWNER_PASSWORD:?Set ORDERS_DB_OWNER_PASSWORD}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD}
      INVENTORY_DB_OWNER_PASSWORD: ${INVENTORY_DB_OWNER_PASSWORD:?Set INVENTORY_DB_OWNER_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}
      BILLING_DB_OWNER_PASSWORD: ${BILLING_DB_OWNER_PASSWORD:?Set BILLING_DB_OWNER_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?Set BILLING_DB_PASSWORD}
      SHIPPING_DB_OWNER_PASSWORD: ${SHIPPING_DB_OWNER_PASSWORD:?Set SHIPPING_DB_OWNER_PASSWORD}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:?Set SHIPPING_DB_PASSWORD}
      NOTIFICATION_DB_OWNER_PASSWORD: ${NOTIFICATION_DB_OWNER_PASSWORD:?Set NOTIFICATION_DB_OWNER_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD}
      OPS_DB_OWNER_PASSWORD: ${OPS_DB_OWNER_PASSWORD:?Set OPS_DB_OWNER_PASSWORD}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?Set OPS_DB_PASSWORD}
      EXPORTER_PASSWORD: ${DB_EXPORTER_PASSWORD:?Set DB_EXPORTER_PASSWORD}
    volumes:
      - mysql-socket:/var/run/mysqld
      - ./mysql/roles.sql:/commerce/roles.sql:ro
      - ./mysql/apply-roles.sh:/commerce/apply-roles.sh:ro
    entrypoint: ["sh", "/commerce/apply-roles.sh"]
    mem_limit: 128m
    pids_limit: 32

  # -------------------------------------------------------------------- kafka

  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      NODE_ID: 1
      ADVERTISED_HOST: kafka-1
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./kafka/start.sh:/commerce/start.sh:ro

  # Creates the services' credentials, the topics and the access rules
  # (kafka/init.sh), then exits. Everything event-driven waits for it.
  kafka-init:
    <<: *hardened
    image: *kafka-image
    restart: "no"
    depends_on:
      kafka-1:
        condition: service_healthy
    networks: [events]
    environment:
      BOOTSTRAP: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092}
      REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
      INIT_PASSWORD: ${KAFKA_PASSWORD_INIT:?Set KAFKA_PASSWORD_INIT}
      KAFKA_PASSWORD_CATALOG: ${KAFKA_PASSWORD_CATALOG:?Set KAFKA_PASSWORD_CATALOG}
      KAFKA_PASSWORD_ORDER: ${KAFKA_PASSWORD_ORDER:?Set KAFKA_PASSWORD_ORDER}
      KAFKA_PASSWORD_INVENTORY: ${KAFKA_PASSWORD_INVENTORY:?Set KAFKA_PASSWORD_INVENTORY}
      KAFKA_PASSWORD_BILLING: ${KAFKA_PASSWORD_BILLING:?Set KAFKA_PASSWORD_BILLING}
      KAFKA_PASSWORD_SHIPPING: ${KAFKA_PASSWORD_SHIPPING:?Set KAFKA_PASSWORD_SHIPPING}
      KAFKA_PASSWORD_NOTIFICATION: ${KAFKA_PASSWORD_NOTIFICATION:?Set KAFKA_PASSWORD_NOTIFICATION}
      KAFKA_PASSWORD_OPS: ${KAFKA_PASSWORD_OPS:?Set KAFKA_PASSWORD_OPS}
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes:
      - ./kafka/init.sh:/commerce/init.sh:ro
    entrypoint: ["/bin/bash", "/commerce/init.sh"]
    tmpfs:
      - /tmp:size=16m
    mem_limit: 384m
    pids_limit: 256

  # ----------------------------------------------------------------- services

  identity:
    <<: *jvm
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: identity
    image: commerce-identity:${IMAGE_TAG:-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    # outbound: the breached-password check, Turnstile and MX lookups.
    networks: [edge, data, outbound, telemetry]
    environment:
      COMMERCE_ENV: ${COMMERCE_ENV:?Set COMMERCE_ENV (dev, int, qa or prod)}
      DB_HOST: mysql
      DB_NAME: identity
      # Reads and writes rows, nothing else. Migrations run as the owner login,
      # at startup only, over a connection that is closed straight after.
      DB_USER: identity_app
      DB_PASS: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      SPRING_FLYWAY_USER: identity_owner
      SPRING_FLYWAY_PASSWORD: ${IDENTITY_DB_OWNER_PASSWORD:?Set IDENTITY_DB_OWNER_PASSWORD}
      DB_PARAMS: "&sslMode=REQUIRED"
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (openssl rand -base64 32)}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY (openssl rand -base64 32)}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_BASE_URL}}
      PASSKEY_EXTRA_ORIGINS: ${PASSKEY_EXTRA_ORIGINS:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # The edges reset X-Forwarded-For, so identity may trust it.
      TRUST_FORWARDED_FOR: "true"
      SIGNUP_CHECK_MX: ${SIGNUP_CHECK_MX:-true}
      ADMIN_REQUIRES_MFA: ${ADMIN_REQUIRES_MFA:-true}
      OPS_REQUIRE_MFA: ${OPS_REQUIRE_MFA:-true}
      OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
      TRACE_SAMPLING: ${TRACE_SAMPLING:-1.0}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # Spring Security, Hibernate and up to MAX_CONCURRENT_HASHES Argon2 hashes
    # (~19 MiB each): 448 MiB thrashed under twenty simulated shoppers.
    mem_limit: 640m

  catalog:
    <<: *jvm
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: catalog
    image: commerce-catalog:${IMAGE_TAG:-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [edge, data, events, telemetry]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/catalog?sslMode=REQUIRED
      DB_USER: catalog_app
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
      DB_OWNER_USER: catalog_owner
      DB_OWNER_PASSWORD: ${CATALOG_DB_OWNER_PASSWORD:?Set CATALOG_DB_OWNER_PASSWORD}
      KAFKA_USERNAME: catalog
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_CATALOG:?Set KAFKA_PASSWORD_CATALOG}

  inventory:
    <<: *jvm
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: inventory
    image: commerce-inventory:${IMAGE_TAG:-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [edge, data, events, telemetry]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/inventory?sslMode=REQUIRED
      DB_USER: inventory_app
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}
      DB_OWNER_USER: inventory_owner
      DB_OWNER_PASSWORD: ${INVENTORY_DB_OWNER_PASSWORD:?Set INVENTORY_DB_OWNER_PASSWORD}
      KAFKA_USERNAME: inventory
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_INVENTORY:?Set KAFKA_PASSWORD_INVENTORY}

  order:
    <<: *jvm
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: order
    image: commerce-order:${IMAGE_TAG:-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [edge, data, events, telemetry]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/orders?sslMode=REQUIRED
      DB_USER: orders_app
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD}
      DB_OWNER_USER: orders_owner
      DB_OWNER_PASSWORD: ${ORDERS_DB_OWNER_PASSWORD:?Set ORDERS_DB_OWNER_PASSWORD}
      KAFKA_USERNAME: order
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_ORDER:?Set KAFKA_PASSWORD_ORDER}
      ORDER_SAGA_TIMEOUT: ${ORDER_SAGA_TIMEOUT:-2m}
      ORDER_MAX_IN_FLIGHT: ${ORDER_MAX_IN_FLIGHT:-5000}
      RETURN_WINDOW_DAYS: ${RETURN_WINDOW_DAYS:-30}

  billing:
    <<: *jvm
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: billing
    image: commerce-billing:${IMAGE_TAG:-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [edge, data, events, telemetry]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/billing?sslMode=REQUIRED
      DB_USER: billing_app
      DB_PASSWORD: ${BILLING_DB_PASSWORD:?Set BILLING_DB_PASSWORD}
      DB_OWNER_USER: billing_owner
      DB_OWNER_PASSWORD: ${BILLING_DB_OWNER_PASSWORD:?Set BILLING_DB_OWNER_PASSWORD}
      KAFKA_USERNAME: billing
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_BILLING:?Set KAFKA_PASSWORD_BILLING}
      # Where money goes. Required everywhere; outside dev it must be a real
      # provider (TestToolingGuard refuses the simulators).
      PAYMENT_GATEWAY_URL: ${PAYMENT_GATEWAY_URL:?Set PAYMENT_GATEWAY_URL}
      PAYMENT_GATEWAY_KEY: ${PAYMENT_GATEWAY_KEY:?Set PAYMENT_GATEWAY_KEY}

  shipping:
    <<: *jvm
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: shipping
    image: commerce-shipping:${IMAGE_TAG:-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [edge, data, events, telemetry]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/shipping?sslMode=REQUIRED
      DB_USER: shipping_app
      DB_PASSWORD: ${SHIPPING_DB_PASSWORD:?Set SHIPPING_DB_PASSWORD}
      DB_OWNER_USER: shipping_owner
      DB_OWNER_PASSWORD: ${SHIPPING_DB_OWNER_PASSWORD:?Set SHIPPING_DB_OWNER_PASSWORD}
      KAFKA_USERNAME: shipping
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_SHIPPING:?Set KAFKA_PASSWORD_SHIPPING}
      # Required everywhere; outside dev it must be a real carrier.
      CARRIER_URL: ${CARRIER_URL:?Set CARRIER_URL}
      CARRIER_KEY: ${CARRIER_KEY:?Set CARRIER_KEY}

  notification:
    <<: *jvm
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: notification
    image: commerce-notification:${IMAGE_TAG:-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [edge, data, events, telemetry]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/notification?sslMode=REQUIRED
      DB_USER: notification_app
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD}
      DB_OWNER_USER: notification_owner
      DB_OWNER_PASSWORD: ${NOTIFICATION_DB_OWNER_PASSWORD:?Set NOTIFICATION_DB_OWNER_PASSWORD}
      KAFKA_USERNAME: notification
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_NOTIFICATION:?Set KAFKA_PASSWORD_NOTIFICATION}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}

  # The monitoring site's API. Observes everything; can change one thing (replay
  # a dead letter). Reaches Prometheus and Loki on the telemetry network, Kafka's
  # admin API on the events network, and probes the edges on the edge network.
  ops:
    <<: *jvm
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: ops
    image: commerce-ops:${IMAGE_TAG:-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [edge, data, events, telemetry]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/ops?sslMode=REQUIRED
      DB_USER: ops_app
      DB_PASSWORD: ${OPS_DB_PASSWORD:?Set OPS_DB_PASSWORD}
      DB_OWNER_USER: ops_owner
      DB_OWNER_PASSWORD: ${OPS_DB_OWNER_PASSWORD:?Set OPS_DB_OWNER_PASSWORD}
      KAFKA_USERNAME: ops
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_OPS:?Set KAFKA_PASSWORD_OPS}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      OPS_REQUIRE_MFA: ${OPS_REQUIRE_MFA:-true}

  # ------------------------------------------------------------ observability
  # Metrics (Prometheus, alerts via Alertmanager), logs (Loki), traces (Tempo),
  # collected by Alloy and shown in Grafana. Losing any of it does not affect the
  # store: nothing in the request or event path waits on it.

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Lets prometheus.yml label every series with the environment.
      - --enable-feature=expand-external-labels
    environment:
      COMMERCE_ENV: ${COMMERCE_ENV:?Set COMMERCE_ENV (dev, int, qa or prod)}
    networks: [telemetry]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:size=16m
    mem_limit: 384m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  alertmanager:
    <<: *hardened
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks: [telemetry]
    volumes:
      # Environments that page people supply their own file (ALERTMANAGER_CONFIG).
      - ${ALERTMANAGER_CONFIG:-./observability/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    tmpfs:
      - /tmp:size=16m
    mem_limit: 96m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  loki:
    <<: *hardened
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yml"]
    networks: [telemetry]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    tmpfs:
      - /tmp:size=32m
    mem_limit: 320m
    pids_limit: 256

  tempo:
    <<: *hardened
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    command: ["-config.file=/etc/tempo/tempo.yml"]
    networks: [telemetry]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    tmpfs:
      - /tmp:size=32m
    mem_limit: 320m
    pids_limit: 256

  # One of only two containers that may see the Docker socket (read-only): it
  # reads container logs. It has no published port and no way out.
  alloy:
    <<: *hardened
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy-state
      - /etc/alloy/config.alloy
    environment:
      COMMERCE_ENV: ${COMMERCE_ENV:?Set COMMERCE_ENV (dev, int, qa or prod)}
      # Only this deployment's containers are collected.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    networks: [telemetry]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # A path of its own: the image's data directory belongs to another user, and
      # with every capability dropped root may not write there.
      - alloy-data:/var/lib/alloy-state
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    pids_limit: 256

  grafana:
    <<: *hardened
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/commerce-overview.json
    networks: [telemetry, grafana-ingress]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  # MySQL server statistics, as a login that can read no Commerce data.
  mysqld-exporter:
    <<: *hardened
    image: prom/mysqld-exporter:v0.21.0@sha256:afad0c59a154fea24ca5ea0e6f95f2b0b168601b111266963dc8a347715b5318
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
      # The server's certificate is self-signed; the connection is still encrypted.
      - --tls.insecure-skip-verify
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_EXPORTER_PASSWORD:?Set DB_EXPORTER_PASSWORD}
    networks: [data, telemetry]
    mem_limit: 64m
    pids_limit: 64

  # -------------------------------------------------------------------- edges

  storefront-web:
    <<: *hardened
    build:
      context: ../web/storefront
      args:
        API_RATE: ${EDGE_API_RATE:-50}
        API_BURST: ${EDGE_API_BURST:-100}
    image: commerce-storefront-web:${IMAGE_TAG:-local}
    depends_on:
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy
      inventory:
        condition: service_healthy
      billing:
        condition: service_healthy
      shipping:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks: [edge, storefront-ingress]
    environment:
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?Set EDGE_SHARED_SECRET}
    ports:
      - "127.0.0.1:${STOREFRONT_PORT:-8081}:8080"
    tmpfs:
      - /tmp:size=96m
    mem_limit: 128m
    pids_limit: 128


  ops-web:
    <<: *hardened
    build:
      context: ../web/ops-console
    image: commerce-ops-web:${IMAGE_TAG:-local}
    depends_on:
      identity:
        condition: service_healthy
      ops:
        condition: service_healthy
    networks: [edge, ops-ingress]
    environment:
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?Set EDGE_SHARED_SECRET}
    ports:
      - "127.0.0.1:${OPS_CONSOLE_PORT:-8082}:8080"
    tmpfs:
      - /tmp:size=32m
    mem_limit: 96m
    pids_limit: 128

networks:
  # Each network has a fixed /24 inside COMMERCE_NET.0.0/16 (scripts/stack.sh sets a
  # different /16 per environment), so the stack never depends on Docker's default
  # address pool, which other projects on the same machine can exhaust.
  #
  # edges ↔ services
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.1.0/24
  # services ↔ mysql
  data:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.2.0/24
  # services ↔ kafka
  events:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.3.0/24
  # services ↔ the observability stack
  telemetry:
    internal: true
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.4.0/24
  ops-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.8.0/24
  grafana-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.7.0/24
  # The way out, for the few services that call real external systems.
  outbound:
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.5.0/24
  # These carry only published ports in. Docker needs a gateway to publish a
  # port; with address translation off, nothing inside can use it to get out.
  storefront-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${COMMERCE_NET:-10.77}.6.0/24

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
  mysql-data:
  mysql-socket:
  kafka-1-data:
